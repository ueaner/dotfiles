# kitty 配置 (kitty 0.50+), 文档: https://sw.kovidgoyal.net/kitty/conf/
# 由 ~/.config/alacritty/alacritty.toml 迁移而来, 保存后 kitty 自动热加载, 无需重启
#
# !! 注释必须独占一行: kitty 不支持行尾注释,
# !! 行尾 # 会成为选项值的一部分, map 行更会把注释当文本发给终端


# ==============================================================================
# 启动
# ==============================================================================

# 经 login shell 启动并进入 tmux
# GUI 启动的 kitty 只有最小 PATH, 直接启动 tmux 会导致状态栏 #(gitmux ...)
# 找不到 aqua 安装的命令; 经 login shell 启动, tmux server 即继承完整 PATH.
# (不能用 env read_from_shell=PATH: kitty 会用 shell 选项的程序探测环境, 对 tmux 无效)
# tmux server 由 launchd 托管 (~/.config/plist/LaunchAgents/io.github.tmux.plist), kitty 只 attach:
# LaunchServices 启动的 kitty 退出时, launchd 会连带杀掉 kitty 派生的 tmux server.
shell /bin/zsh -l -c "exec tmux new-session -A -s TERM"

# SSH 到没有 kitty terminfo 的主机时可启用; 官方推荐在远端安装 terminfo
# env TERM=xterm-256color

# 启动最大化由 macos-launch-services-cmdline (--start-as=maximized) 实现


# ==============================================================================
# 字体与光标
# ==============================================================================

font_family SauceCodePro Nerd Font
font_size   13

# 行距加大 6px
modify_font cell_height 6px

cursor_shape beam


# ==============================================================================
# 窗口
# ==============================================================================

# 隐藏标题栏, 保留圆角和阴影
hide_window_decorations titlebar-only

# 两个值时顺序为: 垂直 水平
window_padding_width 1 2

background_opacity 1.0
scrollback_lines   10000


# ==============================================================================
# 剪贴板
# ==============================================================================

# 允许终端内程序 (含 SSH 远端) 通过 OSC 52 直接读写剪贴板, 不再询问
# 注意: 任何程序都能读取剪贴板, 有安全风险
clipboard_control write-clipboard write-primary read-clipboard read-primary

# 选中即复制 (macOS 没有 primary selection, 故用 clipboard)
copy_on_select clipboard


# ==============================================================================
# 配色: color0-7 = normal, color8-15 = bright
# ==============================================================================

foreground #eaeaea
background #07090c

# 每两行一组: normal / 对应的 bright
color0  #07090c
color8  #4d5770
color1  #df6566
color9  #d54e53
color2  #c5d15c
color10 #b9ca4a
color3  #ecce58
color11 #e6c547
color4  #a8c7fa
color12 #7aa6da
color5  #cfabe0
color13 #c397d8
color6  #81cabf
color14 #70c0ba
color7  #eaeaea
color15 #ffffff

# kitty 无对应项: 加粗不切换亮色 (alacritty draw_bold_text_with_bright_colors),
# 暗色不能逐色指定 (只有 dim_opacity 整体混色)


# ==============================================================================
# 快捷键 (super = macOS Command 键)
# ==============================================================================
#
# 数字/符号键一律用 native 键码 0xNN (美式键盘物理位置):
#   1-9,0  0x12 0x13 0x14 0x15 0x17 0x16 0x1A 0x1C 0x19 0x1D
#   - 0x1B   = 0x18   [ 0x21   ] 0x1E   ; 0x29   ' 0x27
#   , 0x2B   . 0x2F   / 0x2C   \ 0x2A
#
# 原因: 中文输入法激活时, 符号键的键值会漂移成全角标点 (, -> ，  [ -> 【),
#       键名映射失配; native 键码按硬件位置匹配, 不受输入法影响.
#
# 被 kitty 默认映射占用的键要写两行: 键名行覆盖默认映射, native 行兜底输入法.
# 字母键不受输入法影响, 只写键名.
#
# 调试按键: kitten show-key (查键码), kitty --debug-input (查实际键值)
# alacritty 里修 ctrl+q / ctrl+/ 的映射不需要迁移, kitty 原生即发送 \x11 / \x1f

# ------------------------------------------------------------------------------
# 终端
# ------------------------------------------------------------------------------

map super+c      copy_to_clipboard
map super+v      paste_from_clipboard
map super+m      hide_macos_app
map super+q      quit
map super+ctrl+f toggle_fullscreen

# 字号: 重置 / 放大 / 缩小
# 键名行与 kitty 默认映射一致, 只需写 native 行兜底输入法
map super+0x1d change_font_size all 0
map super+0x18 change_font_size all +2.0
map super+0x1b change_font_size all -2.0

# ------------------------------------------------------------------------------
# tmux: 发送 prefix (Alt-s 即 \es) + 按键
# 把 tmux 当普通应用用: tmux session 当窗口, tmux window 当标签页
# ------------------------------------------------------------------------------

# Tmux: 重载配置
map super+r       send_text all \esr
# Client: 刷新 / 分离
map super+shift+r send_text all \esR
map super+shift+d send_text all \esd

# Session: 新建 / 重命名 / 总览 (数字选择, hjkl 移动或搜索)
map super+n       send_text all \esn
map super+shift+n send_text all \esN
map super+shift+e send_text all \esE

# Window: 信息 / 新建 / 关闭
map super+i       send_text all \esi
map super+t       send_text all \est
map super+w       send_text all \esw
# Window: 关闭其他窗口 (待查: 实测关闭了所有窗口, 疑被拦截)
map super+shift+w send_text all \esW

# Window: 下一个 / 上一个 (ctrl+tab 或 cmd+shift+. / cmd+shift+,)
map ctrl+tab         send_text all \es]
map ctrl+shift+tab   send_text all \es[
map super+shift+0x2f send_text all \es]
map super+shift+0x2b send_text all \es[

# Window: 右移 / 左移 (cmd+shift+] / cmd+shift+[, 覆盖默认 next/previous_tab)
map super+shift+right_bracket send_text all \es}
map super+shift+0x1e          send_text all \es}
map super+shift+left_bracket  send_text all \es{
map super+shift+0x21          send_text all \es{

# Window: 上一个活动窗口 (cmd+.)
map super+0x2f send_text all \es.

# Window: 垂直分割 _ / 水平分割 + (覆盖默认调字号)
map super+shift+minus send_text all \es_
map super+shift+0x1b  send_text all \es_
map super+shift+equal send_text all \es+
map super+shift+0x18  send_text all \es+

# Window: 跳转 1-8, 9 = 最右 (覆盖默认 first..ninth_window)
map super+1    send_text all \es1
map super+0x12 send_text all \es1
map super+2    send_text all \es2
map super+0x13 send_text all \es2
map super+3    send_text all \es3
map super+0x14 send_text all \es3
map super+4    send_text all \es4
map super+0x15 send_text all \es4
map super+5    send_text all \es5
map super+0x17 send_text all \es5
map super+6    send_text all \es6
map super+0x16 send_text all \es6
map super+7    send_text all \es7
map super+0x1a send_text all \es7
map super+8    send_text all \es8
map super+0x1c send_text all \es8
map super+9    send_text all \es9
map super+0x19 send_text all \es9

# Pane: 上一个活动面板 (cmd+') / 同步输入开关 (cmd+shift+')
map super+0x27       send_text all \es'
map super+shift+0x27 send_text all \es"

# Pane: 最大化 / 关闭 / 关闭其他面板
map super+z       send_text all \esz
map super+x       send_text all \esx
map super+shift+x send_text all \esX

# Pane: 均分布局 (cmd+shift+\) / 下一个布局 (cmd+\), 见 ~/bin/sway-tmux-layout
map super+shift+0x2a send_text all \es|
map super+0x2a       send_text all \es\\

# Pane: 切换面板, 与 Sway 切换容器一致, 见 ~/bin/sway-tmux-navigation
map super+h send_text all \esh
map super+j send_text all \esj
map super+k send_text all \esk
map super+l send_text all \esl

# Mode: vi 复制模式 / 命令模式 (cmd+shift+;)
# map super+escape     send_text all \es\e
map super+shift+c    send_text all \es\e
map super+shift+0x29 send_text all \es:

# Search: 在复制模式中搜索 (cmd+/ 或 cmd+f)
map super+0x2c send_text all \es/
map super+f    send_text all \es/

# Help: 列出快捷键 (cmd+shift+/, 覆盖默认打开文档)
map super+shift+slash send_text all \es?
map super+shift+0x2c  send_text all \es?

# Paste Buffer
map super+p send_text all \esp

# ------------------------------------------------------------------------------
# 其他
# ------------------------------------------------------------------------------

# Crush: shift+enter 换行
map shift+enter send_text all \x0a
