# kitty 0.50+
# 从 alacritty.toml 迁移而来, 配置文档: https://sw.kovidgoyal.net/kitty/conf/
# 保存本文件后 kitty 自动热加载 (对应 alacritty 的 live_config_reload)
# 注意: kitty.conf 不支持行尾注释, 注释必须独占一行
#       (行尾 # 会成为选项值的一部分, map 行会把注释发给终端!)

#: 允许终端内的应用通过 OSC 52 读写剪贴板 (alacritty: osc52 = "CopyPaste")
#: kitty 默认 read-clipboard-ask 读取前会询问, 此处与 alacritty 行为对齐: 直接读写
#: 注意: 任何程序(含 SSH 远端)都能读剪贴板, 有安全风险
clipboard_control write-clipboard write-primary read-clipboard read-primary

#: 鼠标选中即复制到剪贴板 (alacritty: selection.save_to_clipboard)
#: macOS 无 primary selection, 故用 clipboard
copy_on_select clipboard

#: 打开 kitty 时自动进入 tmux (alacritty: terminal.shell)
#: 注意: GUI 启动的 kitty 不经过 login shell, 传给子进程的 PATH 只有 kitty
#: 自身 bin 和 /usr/bin 等最小集合; tmux server 会继承这份残缺 PATH, 导致
#: 状态栏 #(gitmux ...) 找不到 aqua 安装的命令 (gitmux 是 aqua proxy, 运行
#: 还需要 ~/.local/bin/aqua)。read_from_shell 让 kitty 启动时从 login shell
#: 读取 PATH 注入子进程, tmux server 及其 #( ) 任务因此拿到完整 PATH。
env read_from_shell=PATH
shell tmux new-session -A -s TERM
#: alacritty 设 TERM=xterm-256color 主要是为了 SSH 到无 kitty terminfo 的主机
#: kitty 官方推荐保留 xterm-kitty 并在远端安装 terminfo, 按需取舍
# env TERM=xterm-256color

#: 字体 (alacritty: font.family / size)
#: alacritty 在 macOS 上用 12.25 (Linux 共用配置 11.25), kitty 渲染不同可再微调
font_family SauceCodePro Nerd Font
font_size 13
#: 行距加大 6px (alacritty: offset = { x = 0, y = 6 })
modify_font cell_height 6px

#: 光标竖线 (alacritty: cursor.style shape = "Beam")
cursor_shape beam

#: 窗口 (alacritty: window)
#: decorations = "none" -> macOS 下隐藏标题栏, 保留圆角和阴影
hide_window_decorations titlebar-only
#: padding x = 2, y = 1, kitty 两个值时顺序为 垂直 水平
window_padding_width 1 2
background_opacity 1.0
#: alacritty startup_mode = "Maximized", kitty 无对应配置项:
#:   启动时用 kitty --start-as maximized
#:   或保持默认 remember_window_size yes 记住上次窗口大小/最大化状态
#: alacritty 滚动缓冲区默认 10000 行, kitty 默认 2000
scrollback_lines 10000

#: 配色 (alacritty colors), color0-7 = normal, color8-15 = bright
foreground #eaeaea
background #07090c
color0  #07090c
color1  #df6566
color2  #c5d15c
color3  #ecce58
color4  #a8c7fa
color5  #cfabe0
color6  #81cabf
color7  #eaeaea
color8  #4d5770
color9  #d54e53
color10 #b9ca4a
color11 #e6c547
color12 #7aa6da
color13 #c397d8
color14 #70c0ba
color15 #ffffff
#: 无 kitty 对应配置的两项:
#:   alacritty colors.dim 整组暗色 (kitty 只有 dim_opacity 整体混色, 默认 0.4)
#:   alacritty draw_bold_text_with_bright_colors (kitty 加粗只加粗, 不切换亮色)

#: 键盘映射: super 即 macOS 的 Command 键
#: 同一按键的默认映射被覆盖, 以本文件定义的为准
#: 终端交互动作
map super+c      copy_to_clipboard
map super+v      paste_from_clipboard
map super+m      hide_macos_app
map super+q      quit
map super+ctrl+f toggle_fullscreen
#: 字号: kitty 只有 change_font_size 一个动作, 无 reset/increase/decrease_font_size;
#: 动作名非法时加载不报错、按键无声失效 (迁移时的坑)
map super+0      change_font_size all 0
map super+equal  change_font_size all +2.0
map super+minus  change_font_size all -2.0

# >>> tmux 快捷键: prefix Alt-s 即 \es
#: 把 tmux 当普通应用用, `tmux session` 当窗口, `tmux window` 当标签页
#: 带 shift 的符号键按字符书写 (如 super+?), kitty 默认 shifted fallback
#: 会把 cmd+shift+/ 匹配到 ?, 与 alacritty 按键行为一致
#: Tmux: Reload Config
map super+r        send_text all \esr
#: Client: Refresh
map super+shift+r  send_text all \esR
#: Client: Detach
map super+shift+d  send_text all \esd
#: Session: New
map super+n        send_text all \esn
#: Session: reName
map super+shift+n  send_text all \esN
#: Session Explorer: choose number, hljk move or search
#: Session: Overview
map super+shift+e  send_text all \esE
#: Window: Info
map super+i        send_text all \esi
#: Window: New
map super+t        send_text all \est
#: Window: Close
map super+w        send_text all \esw
#: Window: Close other windows, 被拦截了？关闭了所有窗口
map super+shift+w  send_text all \esW
#: Window: Next
map ctrl+tab       send_text all \es]
#: Window: Previous
map ctrl+shift+tab send_text all \es[
#: alacritty: Super|Shift+> ; kitty 中 > 是按键序列分隔符不能作按键名,
#: 用产生 > 的物理键组合 (macOS 美式键盘 cmd+shift+.)
#: Window: Next
map super+shift+.  send_text all \es]
#: Window: Previous
map super+<        send_text all \es[
#: alacritty 按字符匹配 Super|Shift+} / +{; kitty 必须按物理键写.
#: 原因: kitty 0.50 默认在 super+shift+] / [ 上是 next/previous_tab,
#: 精确匹配优先于 shift 字符回退, super+} / super+{ 永远轮不到.
#: Window: Move Window Right
map super+shift+right_bracket send_text all \es}
#: Window: Move Window Left
map super+shift+left_bracket send_text all \es{
#: Window: Last active
map super+.        send_text all \es.
#: alacritty: Super|Shift+_ / +; kitty 默认 super+shift+minus/equal 是
#: 缩小/放大字号, 同理必须按物理键写.
#: Window: Vertical Split
map super+shift+minus send_text all \es_
#: Window: Horizontal Split
map super+shift+equal send_text all \es+
#: Pane: Last active
map super+'        send_text all \es'
#: Pane: Synchronize Toggle
map super+"        send_text all \es"
#: Pane: Zoom
map super+z        send_text all \esz
#: Pane: Close
map super+x        send_text all \esx
#: Pane: Close other panes
map super+shift+x  send_text all \esX
#: Pane: Evenly Layout
map super+|        send_text all \es|
#: See: ~/bin/sway-tmux-layout
#: Pane: Next Layout
map super+backslash send_text all \es\\
#: Switching panes in Tmux is like switching containers in Sway
#: See: ~/bin/sway-tmux-navigation
#: Pane: Force Left
map super+h        send_text all \esh
#: Pane: Force Down
map super+j        send_text all \esj
#: Pane: Force Up
map super+k        send_text all \esk
#: Pane: Force Right
map super+l        send_text all \esl
#: Mode: Copy Mode vi
map super+escape   send_text all \es\e
#: Mode: Command mode
map super+:        send_text all \es:
#: Search: in copy mode
map super+/        send_text all \es/
#: Search: in copy mode
map super+f        send_text all \es/
#: alacritty: Super|Shift+?; kitty 默认 super+shift+slash 是打开 kitty 文档,
#: 同理必须按物理键写.
#: Help: List key bindings
map super+shift+slash send_text all \es?
#: Paste Buffer
map super+p        send_text all \esp
#: Window: 1
map super+1        send_text all \es1
#: Window: 2
map super+2        send_text all \es2
#: Window: 3
map super+3        send_text all \es3
#: Window: 4
map super+4        send_text all \es4
#: Window: 5
map super+5        send_text all \es5
#: Window: 6
map super+6        send_text all \es6
#: Window: 7
map super+7        send_text all \es7
#: Window: 8
map super+8        send_text all \es8
#: Window: Rightmost
map super+9        send_text all \es9
#: for Crush
map shift+enter    send_text all \x0a
# <<< tmux 快捷键
