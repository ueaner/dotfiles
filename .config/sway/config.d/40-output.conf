# You can get the names of your outputs by running: swaymsg -t get_outputs
# Read `man 5 sway-output` for more information about this section.

# Change the default cursor position
exec ~/bin/sway-cursor-center

### Output configuration

# Dual monitor layout: HDMI-A-2 (external, 2560x1440) on the right of
# eDP-1 (built-in, 2560x1600 @ scale 2 => 1280x800 logical).
# eDP-1 is y-offset so its upper half (logical y 960-1360) lines up with
# the external monitor's bottom third (y 960-1440); eDP-1's lower half
# (1360-1760) has no adjacent output, so the touchpad cursor can only
# cross into HDMI-A-2 from the top half of the built-in screen.
output eDP-1 resolution 2560x1600 scale 2 position 0,960
output HDMI-A-2 resolution 2560x1440 position 1280,0

# Default wallpaper (more resolutions are available in /usr/share/backgrounds/sway/)
# Requires: desktop-backgrounds-compat, swaybg
# output * bg /usr/share/backgrounds/default-dark.jxl fill
# output * bg $XDG_DATA_HOME/backgrounds/f37-01-night.png fill
output * bg ~/.local/share/backgrounds/default-night.jxl fill

### Idle configuration

# ~/.config/swaylock/config
exec swayidle -w \
    timeout 180  'swaylock -f'                 \
    timeout 300  'swaymsg "output * dpms off"' \
    resume       'swaymsg "output * dpms on"'  \
    before-sleep 'swaylock -f'
